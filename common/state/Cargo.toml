[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-common-state"
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"
[features]
simd = ["vek/platform_intrinsics"]
plugins = ["common-assets/plugins", "toml", "wasmtime", "wasmtime-wasi", "tar", "bincode", "serde", "dep:sha2", "dep:hex", "dep:atomic_refcell"]

default = ["simd"]

[dependencies]
common = { package = "veloren-common", path = ".." }
common-net = { package = "veloren-common-net", path = "../net" }
common-ecs = { package = "veloren-common-ecs", path = "../ecs" }
common-base = { package = "veloren-common-base", path = "../base" }
common-assets = { package = "veloren-common-assets", path = "../assets", optional = true}

tokio-parallel = { package = "veloren-tokio-parallel", path = "../tokio-parallel" }
tokio = { version = "=1.52.3", default-features = false, features = ["rt"] }
tracing = "0.1"
vek = { version = "0.17.0", features = ["serde", "mint"] }

# Data structures
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }

# ECS
specs = { version = "0.20", features = ["nightly", "serde", "storage-event-control", "derive"] }

# Plugins
atomic_refcell = { version = "0.1.13", optional = true }
scopeguard = "1.1.0"
serde = { version = "1.0.118", features = ["derive"], optional = true }
toml = { version = "1", optional = true }
tar = { version = "0.4.37", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
timer-queue = "0.1.0"
wasmtime = { version = "45", optional = true , features = ["component-model", "async"] }
wasmtime-wasi = { version = "45.0.2", optional = true }
async-trait = "0.1.42"
futures = "0.3.30"
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4.3", optional = true }

# Tweak running code
#inline_tweak = { version = "1.0.8", features = ["release_tweak"] }

[lib]
test = false
doctest = false
bench = false
