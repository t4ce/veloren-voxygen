[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-common-state"
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"


[dependencies]
common = { package = "veloren-common", path = ".." }
common-net = { package = "veloren-common-net", path = "../net" }
common-ecs = { package = "veloren-common-ecs", path = "../ecs" }
common-base = { package = "veloren-common-base", path = "../base" }

tokio-parallel = { package = "veloren-tokio-parallel", path = "../tokio-parallel" }
tokio = { version = "=1.52.3", default-features = false, features = ["rt"] }
tracing = "0.1"
vek = { version = "0.17.0", features = ["serde", "mint"] }

# Data structures
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }

# ECS
specs = { version = "0.20", features = ["nightly", "serde", "storage-event-control", "derive"] }

# Plugins
scopeguard = "1.1.0"
timer-queue = "0.1.0"
async-trait = "0.1.42"
futures = "0.3.30"

# Tweak running code
#inline_tweak = { version = "1.0.8", features = ["release_tweak"] }

[lib]
test = false
doctest = false
bench = false
