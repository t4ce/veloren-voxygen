[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-common-net"
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"


[dependencies]
common = {package = "veloren-common", path = "../../common"}

bincode = { version = "2", features = ["serde"] }
flate2 = "1.0.20"
lz4_flex = { version = "0.11.6", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
image = { version = "0.25", default-features = false }
num-traits = "0.2"
sum_type = "0.2.0"
vek = { version = "0.17.0", features = ["serde", "mint"] }
tracing = "0.1"

# Data structures
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }

# ECS
specs = { version = "0.20", features = ["nightly", "serde", "storage-event-control"] }

# Serde
serde = { version = "1.0.118", features = ["derive"] }

[lib]
test = false
doctest = false
bench = false

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../../TRUEOS-Blueprints/api" }

[target.'cfg(not(target_os = "trueos"))'.dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

[[test]]
name = "terrain_lz4"
path = "tests/terrain_lz4.rs"
