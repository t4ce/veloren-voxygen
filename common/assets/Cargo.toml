[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-common-assets"
description = "Crate for game loading assets for veloren."
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"
[dependencies]
lazy_static = "1.4.0"
assets_manager = { version = "0.13", features = [
    "ab_glyph",
    "bincode",
    "ron",
    "json",
] }
ron = { version = "0.12", default-features = false, features = ["std"] }
dot_vox = "5.1"
wavefront = "0.2" # TODO: Use vertex-colors branch when we have models that have them
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }

# asset tweak
serde = { version = "1.0.118", features = ["derive"], optional = true }

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../../TRUEOS-Blueprints/api", default-features = false }


[features]
hot-reloading = ["assets_manager/hot-reloading"]
plugins = ["dep:serde", "assets_manager/tar"]

[dev-dependencies]
walkdir = "2.3.2"
serde = { version = "1.0.118", features = ["derive"] }
tempfile = "3.27.0"

