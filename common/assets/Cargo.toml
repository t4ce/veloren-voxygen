[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-common-assets"
description = "Crate for game loading assets for veloren."
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"
[features]
picasso-assets = ["dep:picasso", "dep:serde", "dep:voxy-asset-sync"]

[dependencies]
voxy-asset-sync = { path = "../../../voxy-assets/node-asset-server", optional = true }
lazy_static = "1.4.0"
serde = { version = "1", features = ["derive"], optional = true }
assets_manager = { version = "0.13", features = [
    "ab_glyph",
    "bincode",
    "ron",
    "json",
] }
ron = { version = "0.12", default-features = false, features = ["std"] }
dot_vox = "5.1"
wavefront = "0.2" # TODO: Use vertex-colors branch when we have models that have them
image = { version = "0.25", default-features = false }
tracing = "0.1"
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }

# asset tweak




[lib]
test = false
doctest = false
bench = false

[target.'cfg(target_os = "trueos")'.dependencies]
trueos = { path = "../../../TRUEOS-Blueprints/api" }
picasso = { package = "trueos-picasso", path = "../../../TRUEOS-Picasso", default-features = false, features = ["runtime-assets"], optional = true }

[target.'cfg(not(target_os = "trueos"))'.dependencies]
picasso = { package = "trueos-picasso", path = "../../../TRUEOS-Picasso", default-features = false, features = ["runtime-assets", "test-std"], optional = true }

[dev-dependencies]
tar = { version = "0.4", default-features = false }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
walkdir = "2"

[[bin]]
name = "voxy-assets"
path = "src/bin/voxy_assets.rs"
required-features = ["picasso-assets"]

[target.'cfg(not(target_os = "trueos"))'.dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
