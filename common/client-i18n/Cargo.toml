[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-client-i18n"
description = "Optional crate for internalization and diagnostic of existing localizations for frontends to consume"
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"
[dependencies]
# Assets
common-assets = {package = "veloren-common-assets", path = "../assets"}
common-i18n = { package = "veloren-common-i18n", path = "../i18n" }
serde = { version = "1.0.118", features = ["derive"] }
# Localization
unic-langid = { version = "0.9"}
intl-memoizer = "0.5"
fluent = "0.17"
fluent-bundle = "0.16"
# Utility
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }
tracing = "0.1"
# Bin
clap = { version = "4.2", features = ["derive", "env"], optional = true }
fluent-syntax = "0.12"



[features]
bin = ["clap"]
stat = []

[lib]
test = false
doctest = false
bench = false
