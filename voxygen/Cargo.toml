[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-voxygen"
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "veloren-voxygen"

[package.metadata.nix]
build = true
app = true
desktopFile = "./assets/voxygen/net.veloren.veloren.desktop"
longDescription = """
Veloren is a multiplayer voxel RPG written in Rust.
It is inspired by games such as Cube World, Legend of Zelda: Breath of the Wild, Dwarf Fortress and Minecraft.

This package includes the official client, Voxygen.
"""

[features]
precompiled-shaders = []
hot-anim = ["anim/use-dyn-lib"]
hot-egui = ["voxygen-egui/use-dyn-lib", "egui"]
hot-reloading = ["common/hot-reloading"]
singleplayer = []
simd = ["vek/platform_intrinsics"]
tracy = ["common-frontend/tracy", "client/tracy", "wgpu-profiler/tracy"]
# enables heap profiling with tracy
tracy-memory = ["tracy"]
plugins = ["client/plugins", "anim/plugins", "common/plugins"]
egui-ui = ["voxygen-egui", "egui", "egui-wgpu", "egui-winit"]
shaderc-from-source = ["shaderc/build-from-source"]
discord = ["discord-sdk"]
bin_cmd_doc_gen = []

# We don't ship egui with published release builds so a separate feature is required that excludes it.
default-publish = [
    "native-dialog",
    "plugins",
    "discord",
    "simd",
]
default = []

[dependencies]
mumble-link = "0.2.0"
client = { package = "veloren-client", path = "../client" }
common = { package = "veloren-common", path = "../common" }
common-base = { package = "veloren-common-base", path = "../common/base" }
common-ecs = { package = "veloren-common-ecs", path = "../common/ecs" }
common-frontend = { package = "veloren-common-frontend", path = "../common/frontend" }
common-i18n = { package = "veloren-common-i18n", path = "../common/i18n" }
common-net = { package = "veloren-common-net", path = "../common/net" }
common-state = { package = "veloren-common-state", path = "../common/state" }
common-systems = { package = "veloren-common-systems", path = "../common/systems" }

anim = { package = "veloren-voxygen-anim", path = "anim" }
i18n = { package = "veloren-client-i18n", path = "../client/i18n" }
i18n-helpers = { package = "veloren-voxygen-i18n-helpers", path = "i18n-helpers" }
voxygen-egui = { package = "veloren-voxygen-egui", path = "egui", optional = true }

# Graphics
winit = { version = "0.30.12", features = ["serde"] }
wgpu = { version = "=30.0.0", path = "../../wgpu/wgpu", features = ["spirv", "glsl"] }
wgpu-profiler = "0.28"
bytemuck = { version = "1.7", features = ["derive"] }
shaderc = "0.10"

# Ui
conrod_core = { path = "../vendor/conrod/conrod_core" }
euc = { path = "../vendor/euc" }
# We should probably migrate to a more recent version at some point, but this is significant amount of work.
# Note: this does not depend on the version of `winit` anymore, all dependent code was moved into Voxygen
iced = { package = "iced_native", git = "https://github.com/Imberflur/iced", tag = "veloren-winit-0.28" }
glyph_brush = "0.7.0"
# EGUI
egui = { version = "0.36", optional = true }
egui-wgpu = { version = "0.36", optional = true }
egui-winit = { version = "0.36", optional = true }

# ECS
specs = { version = "0.20", features = ["nightly", "serde", "storage-event-control"] }

# Mathematics
vek = { version = "0.17.0", features = ["serde", "mint"] }

# Controller
gilrs = { version = "0.11.0", features = ["serde-serialize"] }

# Singleplayer

# CLI
clap = { version = "4.2", features = ["derive", "env"] }

# Utility
chrono = { version = "0.4.24", default-features = false, features = ["clock", "std", "serde"] }
chumsky = { version = "0.13", default-features = false, features = ["std"] }
crossbeam-utils = "0.8.7"
crossbeam-channel = "0.5.15"
directories-next = "2.0"
dot_vox = "5.1"
guillotiere = "0.7.0"
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
kira = { version = "0.12", default-features = false, features = [
    "cpal",
    "symphonia",
    "ogg",
    "vorbis",
] }
lazy_static = "1.4.0"
native-dialog = { version = "0.9.0", optional = true }
num-traits = "0.2"
num-integer = "0.1"
ordered-float = { version = "5", default-features = true }
regex = "1.11"
rand = { version = "0.10", features = ["alloc"] }
rand_chacha = "0.10"
tokio-parallel = { package = "veloren-tokio-parallel", path = "../common/tokio-parallel" }
ron = { version = "0.12", default-features = false, features = ["std"] }
serde = { version = "1.0.118", features = ["derive", "rc"] }
serde_with = { version = "3", features = ["hashbrown_0_17"] }
slab = "0.4.2"
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1"
treeculler = "0.4"
tokio = { version = "=1.52.3", default-features = false, features = ["rt", "rt-multi-thread"] }
num_cpus = "1.0"
inline_tweak = "1.0.8"
itertools = "0.14"
sha2 = "0.11"
bitflags = { version = "2.2.1", features = ["serde"] }
open = "5.3.2"

# Discord RPC
discord-sdk = { version = "0.4", optional = true }
enum-map = "2.4"
cpal = "0.18"

[[bin]]
test = false
bench = false
name = "veloren-voxygen"
path = "src/main.rs"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 0

[patch.crates-io]
wgpu = { path = "../../wgpu/wgpu" }
egui-wgpu = { path = "../vendor/egui-wgpu-0.36.2" }
tynm = { path = "../vendor/tynm-0.1.10" }
wavefront = { path = "../vendor/wavefront-0.2.3" }
lz-fear = { path = "../vendor/lz-fear-0.2.0" }
png = { path = "../vendor/png-0.18.1" }
hashbrown_015 = { package = "hashbrown", path = "../vendor/hashbrown-0.15.5" }
rust-argon2 = { path = "../vendor/rust-argon2-2.1.0" }
sha2 = { path = "../vendor/sha2-0.10.9" }
specs = { path = "../vendor/specs" }
shred = { path = "../vendor/shred" }
hibitset = { path = "../vendor/hibitset" }
hashbrown = { path = "../vendor/hashbrown" }
indexmap = { path = "../vendor/indexmap" }

[lib]
test = false
doctest = false
bench = false
