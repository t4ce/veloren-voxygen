[package]
autobins = false
autoexamples = false
autobenches = false
autotests = false
name = "veloren-network"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
[features]
metrics = ["prometheus", "network-protocol/metrics"]
compression = ["lz-fear"]
quic = ["quinn"]

default = ["metrics", "compression", "quic"]

[dependencies]

network-protocol = { package = "veloren-network-protocol", path = "protocol" }

#serialisation
bincode = { version = "2", features = ["serde"] }
serde = { version = "1.0.118", features = ["derive"] }
#ipv4/ipv6 behavior
socket2 = "0.6"
#sending
crossbeam-channel = "0.5.15"
tokio = { version = "=1.52.3", default-features = false, features = ["rt", "io-util", "macros", "net", "time"] }
tokio-stream = { version = "0.1.2", default-features = false }
#tracing and metrics
tracing = "0.1"
prometheus = { version = "0.14", default-features = false, optional = true }
#async
futures-util = { version = "0.3.7", default-features = false, features = ["std"] }
async-channel = "2.1"                                   #use for .close() channels
#mpsc channel registry
lazy_static = "1.4.0"
rand = { version = "0.10", features = ["alloc"] }
#quic support
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"] }
lz-fear = { version = "0.2", optional = true }
# async traits
async-trait = "0.1.42"
bytes = "^1"
# faster HashMaps
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }








[lib]
test = false
doctest = false
bench = false
