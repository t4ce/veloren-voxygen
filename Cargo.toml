[workspace]
resolver = "2"
members = ["voxygen"]
default-members = ["voxygen"]
exclude = ["vendor/euc", "vendor/conrod/conrod_core", "vendor/conrod/conrod_derive", "vendor/specs", "vendor/shred", "vendor/hibitset", "vendor/hashbrown", "vendor/indexmap"]

[workspace.package]
version = "0.18.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 0

[workspace.dependencies]
ahash = "0.8"
async-trait = "0.1.42"
atomic_refcell = "0.1.13"
bincode = { version = "2", features = ["serde"] }
bitflags = "2.2.1"
clap = { version = "4.2", features = ["derive", "env"] }
chrono = { version = "0.4.24", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
criterion = { version = "0.8", default-features = false, features = ["rayon", "cargo_bench_support"] }
crossbeam-channel = "0.5.15"
crossbeam-utils = "0.8.7"
enum-map = "2.4"
enumset = "1.1.3"
futures-util = { version = "0.3.7", default-features = false }
fxhash = "0.2.1"
hashbrown = { version = "0.17", default-features = false, features = ["rayon", "serde", "nightly", "default-hasher", "inline-more", "equivalent"] }
hex = "0.4.3"
inline_tweak = "1.0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
itertools = "0.14"
kiddo = "5"
lazy_static = "1.4.0"
mimalloc = "0.1"
num-traits = "0.2"
num-integer = "0.1"
ordered-float = { version = "5", default-features = true }
prometheus = { version = "0.14", default-features = false }
prometheus-hyper = "0.2.1"
regex = "1.11"
rand = { version = "0.10", features = ["alloc"] }
rand_chacha = "0.10"
tokio-parallel = { package = "veloren-tokio-parallel", path = "common/tokio-parallel" }
ron = { version = "0.12", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
serde = { version = "1.0.118", features = ["derive"] }
serde_json = "1.0.50"
sha2 = "0.11"
slab = "0.4.2"
slotmap = { version = "1.0", features = ["serde"] }
specs = { version = "0.20", features = ["nightly"] }
strum = { version = "0.28", features = ["derive"] }
thread-priority = "3.0.0"
tokio = { version = "=1.52.3", default-features = false, features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["ansi", "env-filter", "fmt", "smallvec", "time"] }
vek = { version = "0.17.0", features = ["serde", "mint"] }
quinn = "0.11"

[patch.crates-io]
wgpu = { path = "../wgpu/wgpu" }
egui-wgpu = { path = "vendor/egui-wgpu-0.36.2" }
tynm = { path = "vendor/tynm-0.1.10" }
wavefront = { path = "vendor/wavefront-0.2.3" }
lz-fear = { path = "vendor/lz-fear-0.2.0" }
png = { path = "vendor/png-0.18.1" }
hashbrown_015 = { package = "hashbrown", path = "vendor/hashbrown-0.15.5" }
rust-argon2 = { path = "vendor/rust-argon2-2.1.0" }
sha2 = { path = "vendor/sha2-0.10.9" }
sha1 = { path = "vendor/sha1-0.10.6" }
specs = { path = "vendor/specs" }
shred = { path = "vendor/shred" }
hibitset = { path = "vendor/hibitset" }
hashbrown = { path = "vendor/hashbrown" }
indexmap = { path = "vendor/indexmap" }
