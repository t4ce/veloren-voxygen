[build]
target-dir = "target"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-gnu]
rustflags = [
    # Required for mimalloc
    "-C",
    "link-arg=-lpsapi",
]

# Keep the existing client userdata location.
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }
# Use this repository's game assets.
VELOREN_ASSETS = { value = "assets", relative = true }


# Preserve the source snapshot version without copying Git history.
VELOREN_GIT_VERSION = "/a5560adc/1791134315"
